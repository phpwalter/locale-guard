version: 1
canonical:
  code: en
  name: English
  country: US
  root: docs/en
translations:
  root: docs/i18n
  languages:
    es: {name: Español, country: ES}
    de: {name: Deutsch, country: DE}
    ja: {name: 日本語, country: JP}
files:
  include: ["**/*.md"]
  exclude: ["_generated/**"]
output:
  status_report: docs/_generated/localization-status.md
  flag_directory: docs/_generated/assets/flags
readme:
  enabled: true
  path: README.md
navigation:
  enabled: true
