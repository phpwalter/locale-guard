name: LocaleGuard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  locale-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and immutable dependencies
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install LocaleGuard dependency
        run: python -m pip install 'PyYAML>=6.0,<7'

      - name: Validate localization governance
        run: python -B tools/locale-guard/locale_guard.py check
